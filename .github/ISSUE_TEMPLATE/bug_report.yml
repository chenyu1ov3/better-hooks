name: Bug report
description: Report a reproducible problem with better-hook.
title: '[Bug]: '
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide a minimal reproduction or link to a repository.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: better-hook, React, Node.js, and package manager versions
    validations:
      required: true
